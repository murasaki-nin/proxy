# 整合版规则 (WMSXWD) - 一个文件顶原来四个
# 用法: 在客户端的远程规则 URL 里只留这一个, 把原来 google-rules / tencent-direct / steam-direct / zzz-direct 四个远程源都删掉, 否则会重复。
# 顺序已在文件里排好, 不用再拖动排序: 直连域名在前, 代理域名在中, 最后 GEOIP,CN,DIRECT 兜底国内 IP 的 UDP 流量 (绝区零战斗流量就靠这条)。
# 直连: 绝区零国服 (mihoyo.com / mhyurl.cn / fastcdn.hoyoverse.com)、腾讯 (qq.com / tencent.com)、Steam 下载。
# 代理: Google / OpenAI 等 67 条, 原样照搬 google-rules.yaml。
# 注意: 不要把 hoyoverse.com / hoyolab.com 整段加进来, 国际服仍走代理; 全局模式下所有规则都不生效, 必须用智能模式/规则模式。
